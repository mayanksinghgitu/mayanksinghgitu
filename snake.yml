> Save this file at: .github/workflows/snake.yml  (inside the mayanksinghgitu/mayanksinghgitu repo)
> Then delete this first line before committing.

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # runs twice a day
  workflow_dispatch:          # lets you trigger it manually
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mayanksinghgitu
          outputs: |
            dist/snake.svg?color_snake=#00FF88&color_dots=#e6f7ee,#9be9a8,#40c463,#30a14e,#216e39
            dist/snake-dark.svg?palette=github-dark&color_snake=#00FF88

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
